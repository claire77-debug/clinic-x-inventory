<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1f4a3f"><title>Clinic · 病历与复方药粉</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#23382e;background:#f1f5ef}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #bad0c0;padding:10px 14px;border-radius:10px;background:#fff;color:#24523b}button.primary{background:#245d43;color:white;border-color:#245d43}button.danger{color:#a33f34;border-color:#e1b9b2}.top{background:#214b38;color:white;padding:18px max(18px,calc((100vw - 1050px)/2))}.top h1{font-size:24px;margin:0}.top small{color:#d2e6d8}.container{max-width:1050px;margin:auto;padding:18px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.nav button.active{background:#dcece0;border-color:#73a58b}.card{border:1px solid #d9e4d9;background:white;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 3px 12px #163d2410}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 10px}p{line-height:1.6}.muted,small{color:#718276}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}label{font-size:13px;color:#576b60;display:block}input,textarea,select{margin-top:5px;width:100%;border:1px solid #cdd9d1;border-radius:9px;padding:11px;background:white;color:#21382c}textarea{min-height:76px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row{padding:12px 0;border-bottom:1px solid #e5ece5;display:flex;align-items:center;justify-content:space-between;gap:8px}.row:last-child{border:0}.pill{border-radius:20px;background:#e8f2e9;padding:4px 9px;font-size:12px;color:#315d47}.metric{font-size:26px;font-weight:750}.compoundrow{display:grid;grid-template-columns:minmax(0,2fr) 105px 40px;gap:8px;align-items:end;margin-bottom:8px}.notice{background:#eef8f0;border:1px solid #b8dbbf;border-radius:9px;padding:12px;font-size:13px}.warn{background:#fff5e7;border-color:#e8caa1}.empty{padding:20px;text-align:center;color:#75877c}.right{text-align:right}.break{overflow-wrap:anywhere}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#274d39;color:white;padding:11px 17px;border-radius:11px;z-index:99;max-width:90vw}dialog{width:min(550px,94vw);border:1px solid #d7e3da;border-radius:14px;padding:20px}dialog::backdrop{background:#0f2419a1}@media(max-width:650px){.container{padding:12px}.grid,.fields{grid-template-columns:1fr}.card{padding:14px}.compoundrow{grid-template-columns:minmax(0,1fr) 85px 32px}.row{align-items:flex-start}.top{padding:17px}}
</style></head><body>
<header class="top"><h1>Clinic · 病历册</h1><small>病历管理 · 已保存病例 · 复方药粉配药</small></header>
<main class="container"><div class="nav" id="nav"></div><div id="screen"></div></main><div id="toast" hidden></div>
<dialog id="rxDialog"><h2>选择已保存病例 · 复方配药</h2><div id="dialogCases"></div><div class="actions"><button id="closeDialog">关闭</button></div></dialog>
<script>
'use strict';
/* Compatible with Clinic v14 IndexedDB: clinic / patients / visits */
const DB='clinic', DEST='./stockbase.html', ORIGIN='https://claire77-debug.github.io';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8), today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
let db,patients=[],visits=[],page='home',selectedVisit=null,draft=[],editingPatient=null,editingVisit=null;
const visitFields=[['cc','主诉'],['wang','舌诊'],['pulse','脉象'],['appetite','食欲'],['sweat','出汗'],['cold','寒热'],['stool','大便'],['urine','小便'],['sleep','睡眠'],['bloat','腹胀'],['menses','月经'],['wen','闻诊'],['ask','问诊'],['dx','诊断辨证'],['rx','原病历处方（文字记录）'],['fee','治疗费用'],['note','医生备注']];
const patientFields=[['name','姓名'],['gender','性别'],['birth','出生日期'],['occ','职业'],['phone','电话'],['ic','身份证 / IC'],['addr','地址'],['memo','备注']];
const powderExamples=['补中益气汤','加味逍遥散','六味地黄丸（浓缩粉）','四君子汤'];
const keyStock='stockbase_herbs_v1';
function notify(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.hidden=true,3500)}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('patients'))d.createObjectStore('patients',{keyPath:'id'});if(!d.objectStoreNames.contains('visits'))d.createObjectStore('visits',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function operation(store,mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction(store,mode),q=fn(t.objectStore(store));t.oncomplete=()=>resolve(q?.result);t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
async function reload(){[patients,visits]=await Promise.all([operation('patients','readonly',s=>s.getAll()),operation('visits','readonly',s=>s.getAll())]);visits.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||(b.ts||0)-(a.ts||0))}
const findPatient=id=>patients.find(x=>x.id===id)||{name:'未知病人'};
function nav(){const items=[['home','首页'],['patients','病人资料'],['cases','已保存病历'],['formula','复方药粉配药']];$('nav').innerHTML=items.map(([id,name])=>`<button data-nav="${id}" class="${page===id?'active':''}">${name}</button>`).join('');}
function goto(p){page=p;render();window.scrollTo(0,0)}
function render(){nav();const s=$('screen');if(page==='home')s.innerHTML=homeView();if(page==='patients')s.innerHTML=patientsView();if(page==='cases')s.innerHTML=casesView();if(page==='formula')s.innerHTML=formulaView()}
function homeView(){return `<div class="grid"><div class="card"><small>病人数</small><div class="metric">${patients.length}</div></div><div class="card"><small>已保存病历</small><div class="metric">${visits.length}</div></div></div><section class="card"><h2>快捷操作</h2><p class="muted">保存病历后，可以从下方选择已有病例，再前往 StockBase 开复方药粉。选择病例本身不会扣库存。</p><div class="actions"><button class="primary" data-nav="cases">选择已保存病例</button><button data-act="addpatient">+ 新增病人</button><button data-nav="formula">复方配药</button></div></section><section class="card"><h2>最近病历</h2>${caseRows(visits.slice(0,8))}</section><section class="card notice warn">这是可单独上传的 Clinic 版本，沿用旧版 IndexedDB 的病人及就诊记录，但并非旧版全部功能的逐项复制。上传前请先备份病历；尤其是旧版照片、PIN、PDF 等功能，请先确认新版本满足需求。手机与电脑尚未同步病历。</section>`}
function patientsView(){return `<section class="card"><div class="actions" style="justify-content:space-between;align-items:center"><h2>病人资料</h2><button class="primary" data-act="addpatient">+ 新增病人</button></div><input id="patientSearch" placeholder="搜索姓名 / 电话 / IC" aria-label="搜索病人"><div id="patientsResult">${patientRows()}</div></section>`}
function patientRows(q=''){const matches=patients.filter(p=>!q||[p.name,p.phone,p.ic].join(' ').toLowerCase().includes(q.toLowerCase())).sort((a,b)=>String(a.name).localeCompare(String(b.name),'zh'));return matches.map(p=>`<div class="row"><div class="break"><strong>${esc(p.name)}</strong><div class="muted" style="font-size:12px">${esc(p.phone||'')} · ${visits.filter(v=>v.pid===p.id).length} 份病历</div></div><div class="actions"><button data-act="newvisit" data-id="${esc(p.id)}">新增病历</button><button data-act="editpatient" data-id="${esc(p.id)}">编辑</button></div></div>`).join('')||'<div class="empty">没有病人资料</div>'}
function caseRows(arr){return arr.map(v=>`<div class="row"><div class="break"><strong>${esc(findPatient(v.pid).name)}</strong><div class="muted" style="font-size:12px">${esc(v.date||'')} · ${esc(v.type||'就诊')} · ${esc((v.cc||'').slice(0,70))}</div></div><div class="actions"><button data-act="viewvisit" data-id="${esc(v.id)}">查看</button><button class="primary" data-act="choose" data-id="${esc(v.id)}">开药</button></div></div>`).join('')||'<div class="empty">尚无已保存的病历</div>'}
function casesView(){return `<section class="card"><h2>已保存病例</h2><p class="muted">从以下病历选择一份复方开药，不需重新填写病人信息。</p><input id="caseSearch" placeholder="搜索病人姓名、日期、主诉"><div id="caseResults">${caseRows(visits)}</div></section>`}
const field=(name,label,value='',textarea=false)=>`<label>${esc(label)}${textarea?`<textarea name="${name}">${esc(value)}</textarea>`:`<input name="${name}" value="${esc(value)}">`}</label>`;
function editPatientView(p={}){editingPatient=p.id||null;return `<section class="card"><h2>${p.id?'编辑病人':'新增病人'}</h2><form id="patientForm" class="fields">${patientFields.map(([k,label])=>field(k,label,p[k]||'',k==='memo')).join('')}<div class="actions full"><button class="primary" type="submit">保存病人</button><button type="button" data-nav="patients">取消</button></div></form></section>`}
function editVisitView(v={},pid){editingVisit=v.id||null;let p=findPatient(pid||v.pid);return `<section class="card"><h2>${v.id?'编辑病历':'新增病历'} · ${esc(p.name)}</h2><form id="visitForm" class="fields"><label>日期<input type="date" name="date" value="${esc(v.date||today())}" required></label><label>就诊类型<select name="type"><option ${v.type==='初诊'?'selected':''}>初诊</option><option ${v.type==='复诊'?'selected':''}>复诊</option></select></label>${visitFields.map(([k,label])=>field(k,label,v[k]||'',true)).join('')}<div class="actions full"><button class="primary" type="submit">保存病历</button><button type="button" data-nav="cases">取消</button></div></form></section>`}
function viewVisit(v){return `<section class="card"><h2>${esc(findPatient(v.pid).name)} · ${esc(v.date||'')}</h2><p class="muted">${esc(v.type||'就诊')}</p>${visitFields.filter(([k])=>v[k]).map(([k,label])=>`<div class="row" style="display:block"><strong>${label}</strong><div style="white-space:pre-wrap" class="break">${esc(v[k])}</div></div>`).join('')}<div class="actions"><button data-act="editvisit" data-id="${esc(v.id)}">编辑病历</button><button class="primary" data-act="choose" data-id="${esc(v.id)}">选择这份病历 · 开复方</button><button data-nav="cases">返回列表</button></div></section>`}
function formulaView(){const v=visits.find(x=>x.id===selectedVisit);return `<section class="card"><h2>复方药粉配药</h2><p class="muted">选择已保存病历，跳转 StockBase 输入实际药粉与克数，并在确认发药时扣库存。</p><label>关联病历<select id="visitSelect"><option value="">— 请选择已保存的病例 —</option>${visits.map(x=>`<option value="${esc(x.id)}" ${selectedVisit===x.id?'selected':''}>${esc(findPatient(x.pid).name)} · ${esc(x.date||'')} · ${esc(x.type||'')}</option>`).join('')}</select></label>${v?`<div class="notice"><strong>${esc(findPatient(v.pid).name)}</strong> · ${esc(v.date)}<br>主诉：${esc(v.cc||'未填写')}<br>原病历处方：${esc(v.rx||'未填写')}</div>`:''}<div class="actions"><button class="primary" data-act="sendcase" ${v?'':'disabled'}>进入 StockBase · 复方开药</button><button data-nav="cases">浏览全部病例</button></div></section><section class="card"><h3>复方药粉使用说明</h3><p>如现成复方药粉「补中益气汤」与「加味逍遥散」混合给病人，应分别记录各自每份克数，按份数扣各自药粉库存；不要再扣除该复方原始组成的单味药材。</p><div class="notice warn">Clinic 和 StockBase 须在相同浏览器使用已部署的联动版；GitHub Pages 本身不提供手机与电脑实时共享数据库。</div></section>`}
function sendCase(v){const record={id:String(v.id),patientId:String(v.pid),name:String(findPatient(v.pid).name||''),date:String(v.date||''),type:String(v.type||''),rx:String(v.rx||'')};try{localStorage.setItem('stockbase_pending_clinic_case_v1',JSON.stringify(record))}catch(err){console.warn('无法临时传递病例',err)}const w=window.open(DEST,'_blank');if(!w){notify('浏览器拦截新窗口，请允许弹出窗口');return}const data={id:String(v.id),patientId:String(v.pid),name:String(findPatient(v.pid).name||''),date:String(v.date||''),type:String(v.type||''),rx:String(v.rx||'')};let done=false,count=0;const push=()=>{if(done||w.closed||count++>50){clearInterval(timer);window.removeEventListener('message',recv);return}w.postMessage({kind:'CLINIC_CASE_V1',case:data},ORIGIN)};function recv(e){if(e.origin!==ORIGIN||e.source!==w)return;if(e.data?.kind==='STOCKBASE_READY_V1')push();if(e.data?.kind==='STOCKBASE_CASE_ACK'&&String(e.data.id)===data.id){done=true;clearInterval(timer);window.removeEventListener('message',recv);notify('病历已传送到 StockBase')}}window.addEventListener('message',recv);const timer=setInterval(push,700);push()}
$('nav').onclick=e=>{const b=e.target.closest('[data-nav]');if(b)goto(b.dataset.nav)};
$('screen').addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-nav]');if(!b)return;if(b.dataset.nav){goto(b.dataset.nav);return}const id=b.dataset.id,v=visits.find(x=>x.id===id),p=patients.find(x=>x.id===id);switch(b.dataset.act){case 'addpatient':page='patientform';nav();$('screen').innerHTML=editPatientView();break;case 'editpatient':page='patientform';nav();$('screen').innerHTML=editPatientView(p);break;case 'newvisit':page='visitform';nav();selectedVisit=null;$('screen').innerHTML=editVisitView({},id);$('visitForm').dataset.pid=id;break;case 'editvisit':page='visitform';nav();$('screen').innerHTML=editVisitView(v);$('visitForm').dataset.pid=v.pid;break;case 'viewvisit':page='detail';nav();$('screen').innerHTML=viewVisit(v);break;case 'choose':selectedVisit=id;goto('formula');break;case 'sendcase':if(selectedVisit)sendCase(visits.find(x=>x.id===selectedVisit));break;}});
$('screen').addEventListener('input',e=>{if(e.target.id==='patientSearch')$('patientsResult').innerHTML=patientRows(e.target.value);if(e.target.id==='caseSearch'){let q=e.target.value.toLowerCase();$('caseResults').innerHTML=caseRows(visits.filter(v=>[findPatient(v.pid).name,v.date,v.cc,v.dx].join(' ').toLowerCase().includes(q)))}});
$('screen').addEventListener('change',e=>{if(e.target.id==='visitSelect'){selectedVisit=e.target.value||null;render()}});
$('screen').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,values=Object.fromEntries(new FormData(f));if(f.id==='patientForm'){if(!values.name?.trim()){notify('请填写病人姓名');return}const old=patients.find(p=>p.id===editingPatient)||{};const obj={...old,...values,id:editingPatient||uid()};await operation('patients','readwrite',s=>s.put(obj));await reload();notify('病人已保存');goto('patients')}if(f.id==='visitForm'){const pid=f.dataset.pid;if(!pid||!patients.some(p=>p.id===pid)){notify('病人记录不存在');return}const old=visits.find(v=>v.id===editingVisit)||{};const obj={...old,...values,id:editingVisit||uid(),pid,ts:Date.now()};await operation('visits','readwrite',s=>s.put(obj));await reload();selectedVisit=obj.id;notify('病历已保存，可立即开复方');goto('formula')}});
$('closeDialog').onclick=()=>$('rxDialog').close();
(async()=>{try{db=await openDB();await reload();render()}catch(e){$('screen').innerHTML='<div class="card"><h2>无法读取病历</h2><p>'+esc(e.message)+'</p><p>请使用同一个 Clinic 网址，并检查浏览器是否允许 IndexedDB。</p></div>'}})();
</script></body></html>
